<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Historical Figures Playlist</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --spotify-green: #1db954;
            --bg-dark: #121212;
            --bg-light: #282828;
            --text-main: #ffffff;
            --text-muted: #b3b3b3;
            --player-bg: #181818;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-dark);
            color: var(--text-main);
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
        }

        /* Main Content */
        .main-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow-y: auto;
            padding: 2rem;
            padding-bottom: 100px; /* Space for the player */
            background: linear-gradient(to bottom, #2b2b2b 0%, var(--bg-dark) 100%);
        }

        .header {
            display: flex;
            align-items: center;
            margin-bottom: 2rem;
        }

        .playlist-cover {
            width: 200px;
            height: 200px;
            background-color: var(--bg-light);
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 60px rgba(0,0,0,.5);
            margin-right: 2rem;
            font-size: 4rem;
            color: var(--text-muted);
        }

        .playlist-info h1 {
            font-size: 3rem;
            font-weight: 900;
            margin-bottom: 0.5rem;
        }

        .playlist-info p {
            color: var(--text-muted);
            font-size: 0.9rem;
        }

        /* Track List */
        .track-list {
            width: 100%;
            border-collapse: collapse;
        }

        .track-list th {
            text-align: left;
            color: var(--text-muted);
            font-weight: normal;
            padding: 0.5rem 1rem;
            border-bottom: 1px solid rgba(255,255,255,0.1);
        }

        .track-item {
            cursor: pointer;
            border-radius: 4px;
            transition: background-color 0.2s ease;
        }

        .track-item:hover {
            background-color: rgba(255,255,255,0.1);
        }

        .track-item td {
            padding: 0.8rem 1rem;
        }

        .track-item.active {
            color: var(--spotify-green);
        }

        .track-number {
            width: 50px;
            text-align: center;
            color: var(--text-muted);
        }

        .track-item:hover .track-number {
            display: none;
        }

        .track-item .play-icon {
            display: none;
            width: 50px;
            text-align: center;
        }

        .track-item:hover .play-icon {
            display: table-cell;
        }

        /* Bottom Player */
        .player-bar {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            height: 90px;
            background-color: var(--player-bg);
            border-top: 1px solid #282828;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 1rem;
            z-index: 1000;
        }

        .now-playing {
            width: 30%;
            display: flex;
            align-items: center;
        }

        .track-name-display {
            font-weight: bold;
            font-size: 0.9rem;
        }

        .player-controls-container {
            width: 40%;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .controls {
            display: flex;
            align-items: center;
            gap: 1.5rem;
            margin-bottom: 0.5rem;
        }

        .controls button {
            background: none;
            border: none;
            color: var(--text-muted);
            font-size: 1rem;
            cursor: pointer;
            transition: color 0.2s;
        }

        .controls button:hover {
            color: var(--text-main);
        }

        .controls .play-pause-btn {
            background-color: var(--text-main);
            color: black;
            width: 32px;
            height: 32px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1rem;
            transition: transform 0.1s;
        }

        .controls .play-pause-btn:hover {
            transform: scale(1.05);
            background-color: var(--text-main);
        }

        .progress-container {
            display: flex;
            align-items: center;
            width: 100%;
            max-width: 600px;
            gap: 0.5rem;
            font-size: 0.75rem;
            color: var(--text-muted);
        }

        .progress-bar-bg {
            flex: 1;
            height: 4px;
            background-color: #535353;
            border-radius: 2px;
            cursor: pointer;
            position: relative;
        }

        .progress-bar-fill {
            height: 100%;
            background-color: var(--text-main);
            border-radius: 2px;
            width: 0%;
        }

        .progress-bar-bg:hover .progress-bar-fill {
            background-color: var(--spotify-green);
        }

        .spacer {
            width: 30%;
        }

        /* Custom Scrollbar */
        ::-webkit-scrollbar {
            width: 10px;
        }
        ::-webkit-scrollbar-track {
            background: transparent;
        }
        ::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.3);
            border-radius: 5px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: rgba(255, 255, 255, 0.5);
        }
    </style>
</head>
<body>

    <div class="main-container">
        <div class="header">
            <div class="playlist-cover">
                <i class="fa-solid fa-music"></i>
            </div>
            <div class="playlist-info">
                <p>PLAYLIST</p>
                <h1>Historical Figures</h1>
                <p>Archive Audio Recordings</p>
            </div>
        </div>

        <table class="track-list">
            <thead>
                <tr>
                    <th style="width: 50px; text-align: center;">#</th>
                    <th>Title</th>
                </tr>
            </thead>
            <tbody id="track-list-body">
                <!-- Tracks will be injected here via JavaScript -->
            </tbody>
        </table>
    </div>

    <div class="player-bar">
        <div class="now-playing">
            <div class="track-name-display" id="current-title">Select a track</div>
        </div>

        <div class="player-controls-container">
            <div class="controls">
                <button id="prev-btn" title="Previous"><i class="fa-solid fa-backward-step"></i></button>
                <button class="play-pause-btn" id="play-pause-btn" title="Play/Pause"><i class="fa-solid fa-play"></i></button>
                <button id="next-btn" title="Next"><i class="fa-solid fa-forward-step"></i></button>
            </div>
            <div class="progress-container">
                <span id="current-time">0:00</span>
                <div class="progress-bar-bg" id="progress-container">
                    <div class="progress-bar-fill" id="progress-bar"></div>
                </div>
                <span id="total-duration">0:00</span>
            </div>
        </div>
        
        <div class="spacer"></div>
    </div>

    <audio id="audio-element"></audio>

    <script>
        const tracks = [
            "Ahmet Anzavur .m4a",
            "Ali Galip .m4a",
            "Çapanoğlu Brothers .m4a",
            "Çerkez Ethem .m4a",
            "Çerkez Reşit .m4a",
            "Çopur Musa .m4a",
            "Delibaş Mehmet .m4a",
            "Demirci Mehmet Efe .m4a",
            "Gökçen Efe .m4a",
            "Hacı Sami .m4a",
            "Hasan Tahsin .m4a",
            "Ipsiz Recep.m4a",
            "Kara Fatma .m4a",
            "Kara Hasan .m4a",
            "Kozanoğlu Doğan .m4a",
            "Kuşçubaşı Eşref .m4a",
            "Kılavuz Hatice .m4a",
            "Sadiye Hanım .m4a",
            "Sarı Efe Edip .m4a",
            "Süleyman Şefik Pasha .m4a",
            "Sütçü İmam .m4a",
            "Şahin Bey.wav",
            "Şerife Bacı .m4a",
            "Tayyar Rahmiye .m4a",
            "Topal Osman .m4a",
            "Tufan Bey .m4a",
            "Yahya Kaptan.mp3",
            "Yörük Ali Efe.mp3",
            "Ziya Hurşit.mp3"
        ];

        let currentTrackIndex = 0;
        let isPlaying = false;

        const audio = document.getElementById("audio-element");
        const playPauseBtn = document.getElementById("play-pause-btn");
        const prevBtn = document.getElementById("prev-btn");
        const nextBtn = document.getElementById("next-btn");
        const progressBar = document.getElementById("progress-bar");
        const progressContainer = document.getElementById("progress-container");
        const currentTimeEl = document.getElementById("current-time");
        const totalDurationEl = document.getElementById("total-duration");
        const currentTitleEl = document.getElementById("current-title");
        const trackListBody = document.getElementById("track-list-body");

        // Format filename for display (remove extensions)
        function formatTitle(filename) {
            return filename.replace(/\.(m4a|wav|mp3)$/i, '').trim();
        }

        // Initialize playlist UI
        function initPlaylist() {
            tracks.forEach((track, index) => {
                const tr = document.createElement("tr");
                tr.classList.add("track-item");
                tr.id = `track-${index}`;
                
                tr.innerHTML = `
                    <td class="track-number">${index + 1}</td>
                    <td class="play-icon"><i class="fa-solid fa-play"></i></td>
                    <td>${formatTitle(track)}</td>
                `;
                
                tr.addEventListener("click", () => {
                    loadTrack(index);
                    playTrack();
                });
                
                trackListBody.appendChild(tr);
            });
            
            // Load first track into player without playing
            // Use encodeURI so the browser correctly finds files with Turkish characters
            if (tracks.length > 0) {
                audio.src = encodeURI(tracks[0]);
                currentTitleEl.textContent = formatTitle(tracks[0]);
                updateActiveTrackRow(0);
            }
        }

        function updateActiveTrackRow(index) {
            document.querySelectorAll(".track-item").forEach(el => {
                el.classList.remove("active");
                el.querySelector('.track-number').style.display = '';
                el.querySelector('.play-icon').style.display = '';
            });
            const activeRow = document.getElementById(`track-${index}`);
            if (activeRow) {
                activeRow.classList.add("active");
            }
        }

        function loadTrack(index) {
            currentTrackIndex = index;
            // Use encodeURI so the browser correctly finds files with Turkish characters
            audio.src = encodeURI(tracks[index]);
            currentTitleEl.textContent = formatTitle(tracks[index]);
            updateActiveTrackRow(index);
        }

        function playTrack() {
            audio.play();
            isPlaying = true;
            playPauseBtn.innerHTML = '<i class="fa-solid fa-pause"></i>';
        }

        function pauseTrack() {
            audio.pause();
            isPlaying = false;
            playPauseBtn.innerHTML = '<i class="fa-solid fa-play"></i>';
        }

        function togglePlayPause() {
            if (isPlaying) {
                pauseTrack();
            } else {
                playTrack();
            }
        }

        function prevTrack() {
            currentTrackIndex--;
            if (currentTrackIndex < 0) {
                currentTrackIndex = tracks.length - 1;
            }
            loadTrack(currentTrackIndex);
            playTrack();
        }

        function nextTrack() {
            currentTrackIndex++;
            if (currentTrackIndex > tracks.length - 1) {
                currentTrackIndex = 0; // Loop back to start
            }
            loadTrack(currentTrackIndex);
            playTrack();
        }

        function updateProgress(e) {
            const { duration, currentTime } = e.srcElement;
            
            if (isNaN(duration)) return;
            
            // Update progress bar
            const progressPercent = (currentTime / duration) * 100;
            progressBar.style.width = `${progressPercent}%`;

            // Calculate display time
            const formatTime = (time) => {
                const minutes = Math.floor(time / 60);
                const seconds = Math.floor(time % 60);
                return `${minutes}:${seconds < 10 ? '0' : ''}${seconds}`;
            };

            currentTimeEl.textContent = formatTime(currentTime);
            totalDurationEl.textContent = formatTime(duration);
        }

        function setProgress(e) {
            const width = this.clientWidth;
            const clickX = e.offsetX;
            const duration = audio.duration;
            audio.currentTime = (clickX / width) * duration;
        }

        // Event Listeners
        playPauseBtn.addEventListener("click", togglePlayPause);
        prevBtn.addEventListener("click", prevTrack);
        nextBtn.addEventListener("click", nextTrack);
        audio.addEventListener("timeupdate", updateProgress);
        progressContainer.addEventListener("click", setProgress);
        
        // Auto play next track when current ends
        audio.addEventListener("ended", nextTrack);

        // Load metadata to show total duration immediately if possible
        audio.addEventListener('loadedmetadata', () => {
             const formatTime = (time) => {
                const minutes = Math.floor(time / 60);
                const seconds = Math.floor(time % 60);
                return `${minutes}:${seconds < 10 ? '0' : ''}${seconds}`;
            };
            totalDurationEl.textContent = formatTime(audio.duration);
        });

        // Initialize on load
        initPlaylist();

    </script>
</body>
</html>
